# Milestone 0 (post 9, plan 3a): the Qwen2.5 instruct models on the dev split (a base
# model only if the rule reaches it; 0.5B base not at all), the rule's verdict, one greedy
# pass run twice, and a LoRA-vs-full training-step probe. Generation: the batched engine
# (tinytools.engine), 64 sequences per batch on CUDA.
#   scripts/lambda.sh estimate milestone0, then scripts/lambda.sh run milestone0
#
# Instance (the author, 2026-11-21: an A100, 80 GB if available). gpu_1x_a100_sxm4 is
# Lambda's 1x A100 SXM4, which is 40 GB (tinyvlm's run on it reported A100-SXM4-40GB);
# no 1x A100 80 GB name is known here without the live API. `estimate` lists every A100
# type Lambda offers with its memory, price and capacity: if a 1x A100 80 GB type is
# listed with capacity, put its name here (the 3B full fine-tune probe may run out of
# memory on 40 GB; the probe prints "out of memory" for that row and carries on).
#
# Hours (docs/lambda-playbook.md, "Milestone 0's estimate"): batches x 512 decode steps
# (every batch assumed to run to the token cap) x an assumed 35 ms per batched decode step
# on the A100 (not measured; Milestone 0 measures it), plus ~24 min of boot, setup,
# downloads, loading, the training probe, fetch and teardown. With --base-when-needed:
# 1.0 h if an instruct model qualifies, 1.2 h if base 1.5B is needed, 1.4 h if both base
# models are; at 70 ms/step 1.5 / 1.9 / 2.2 h. expected_hours is the middle case at
# 35 ms. milestone0 is given the deadline ($TINYTOOLS_DEADLINE_EPOCH: when the runner's
# remote time limit fires, max_hours less the 10-minute reserve and 30 s, from when the
# commands start): before each model it estimates, conservatively, from what was measured
# so far, and does not start one that can't finish; it then prints the rule from what was
# measured, the verdict "incomplete" if the rule reaches an unscored model, and exits 1.
# If SIGTERM comes first (the time limit, or the run stopped), it prints the same from
# what was measured. Then bring it to the author.
# Worst case: max_hours x the live price ($10.00 at $2.50/h; refused above that).
name = "milestone0"
post = 9
instance_type = "gpu_1x_a100_sxm4"   # 40 GB; checked against the live list at launch
max_hours = 4.0                      # hard limit on the instance's life, launch to termination
expected_hours = 1.2
cap_usd = 10                         # refuse to launch past this total for the experiment
commands = [
  "uv run tinytools toolace-convert",       # data/ is not in git: the SFT rows the probe needs
  "uv run tinytools sft-data --seeds 1",
  'uv run tinytools milestone0 --base-when-needed --deadline-epoch "$TINYTOOLS_DEADLINE_EPOCH"',
]
# Only files these commands write (fetch also skips any not written during the run).
fetch = [
  "outputs/milestone0.txt",
  "outputs/milestone0-setup.json",
  "outputs/milestone0-Qwen2.5-*-replies.jsonl",
  "outputs/toolace-convert.txt",
  "outputs/sft-data.txt",
]
setup_record = "outputs/milestone0-setup.json"
